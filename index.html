<!DOCTYPE html>
<html lang="en-us">
  <head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Taroxa</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
      #unity-container.unity-mobile { width: 100vw; height: 100vh; }
      #unity-canvas.unity-mobile { width: 100vw !important; height: 100vh !important; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Taroxa</div>
      </div>
    </div>
    <script>
      // Общая логика переключения fullscreen — вынесена в отдельную функцию,
      // чтобы её можно было вызвать и по Escape, и автоматически на ПК.
      function toggleTelegramFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
          var tgw = window.Telegram.WebApp;
          console.log("[fullscreen-toggle] tg.isFullscreen =", tgw.isFullscreen);
          try {
            if (tgw.isFullscreen) {
              tgw.exitFullscreen();
            } else {
              tgw.requestFullscreen();
            }
          } catch (err) {
            console.log("[fullscreen-toggle] wrapper call failed, trying postEvent", err);
          }
          // Fallback напрямую через postEvent, в обход telegram-web-app.js,
          // на случай если версия клиента не поддерживает обёртку.
          if (tgw.postEvent) {
            try {
              tgw.postEvent(tgw.isFullscreen ? "web_app_exit_fullscreen" : "web_app_request_fullscreen");
            } catch (err) {
              console.log("[fullscreen-toggle] postEvent failed", err);
            }
          }
        } else {
          console.log("[fullscreen-toggle] window.Telegram.WebApp not found");
        }
      }

      // Регистрируем обработчик Esc максимально рано (до загрузки Unity-скрипта),
      // на window, с capture:true — чтобы перехватить событие раньше, чем это
      // сделает сам Unity (он тоже вешает свои слушатели клавиатуры на window).
      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc" || e.keyCode === 27) {
          console.log("[fullscreen-toggle] Escape pressed");
          toggleTelegramFullscreen();
        }
      }, true);

      // Разворачиваем Telegram Mini App на весь экран как можно раньше
      if (window.Telegram && window.Telegram.WebApp) {
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // На ПК (Telegram Desktop / macOS / Web-клиент) полноэкранный режим
        // не нужен так же, как на телефоне — а после tg.requestFullscreen()
        // ниже он всё равно окажется включённым. Поэтому на десктопе сразу
        // после входа в fullscreen автоматически "нажимаем Escape" —
        // т.е. вызываем тот же toggleTelegramFullscreen(), который его выключит.
        // Значения tg.platform для мобильных: "android", "android_x", "ios".
        // Всё остальное (tdesktop, macos, web, weba, webk и т.п.) считаем ПК.
        var isMobilePlatform = tg.platform === "android" || tg.platform === "android_x" || tg.platform === "ios";

        if (tg.requestFullscreen) {
          try { tg.requestFullscreen(); } catch (e) {}
        }

        if (!isMobilePlatform) {
          console.log("[fullscreen-toggle] desktop platform detected (" + tg.platform + "), auto-toggling fullscreen off");
          // Небольшая задержка, чтобы requestFullscreen выше успел применить
          // isFullscreen = true до того, как мы его выключим.
          setTimeout(toggleTelegramFullscreen, 100);
        }

        // На случай, если Telegram присылает событие изменения viewport
        // (например, после сворачивания/разворачивания клавиатуры) —
        // держим приложение развернутым.
        tg.onEvent("viewportChanged", function () {
          tg.expand();
        });
      }

      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.br",
        frameworkUrl: buildUrl + "/Web.framework.js.br",
        codeUrl: buildUrl + "/Web.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Taroxa",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // Всегда растягиваем canvas на весь экран (и на мобильных, и на десктопе),
      // т.к. приложение открывается как Telegram Mini App в полноэкранном режиме.
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;

      canvas.style.background = "url('" + buildUrl + "/Web.jpg') center / cover";
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
